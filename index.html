<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Northwind - Web Application Management</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light">

    <div class="container py-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-md-12 text-center">
                <h2 class="fw-bold text-primary">ระบบจัดการข้อมูลสินค้า (Northwind)</h2>
                <p class="text-muted">Cloud Platform (PaaS) - Railway Deployment</p>
            </div>
        </div>

        <!-- Search & Add Button -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body">
                <div class="row g-2">
                    <div class="col-md-9">
                        <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="🔍 ค้นหาชื่อสินค้า..." onkeyup="loadProducts()">
                    </div>
                    <div class="col-md-3">
                        <button class="btn btn-success btn-lg w-100 fw-bold" onclick="openAddModal()">+ เพิ่มสินค้าใหม่</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Product Table -->
        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th class="text-center" style="width: 10%;">ID</th>
                                <th style="width: 45%;">ชื่อสินค้า (Product Name)</th>
                                <th class="text-end" style="width: 15%;">ราคา ($)</th>
                                <th class="text-end" style="width: 15%;">คงเหลือ</th>
                                <th class="text-center" style="width: 15%;">การจัดการ</th>
                            </tr>
                        </thead>
                        <tbody id="productTable">
                            <tr><td colspan="5" class="text-center py-4">กำลังโหลดข้อมูล...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Form (Add / Edit) -->
    <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="modalTitle">จัดการข้อมูลสินค้า</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="productForm">
                        <input type="hidden" id="p_id">
                        <div class="mb-3">
                            <label class="form-label fw-bold">ชื่อสินค้า <span class="text-danger">*</span></label>
                            <input type="text" id="p_name" class="form-control" placeholder="ระบุชื่อสินค้า">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">ราคาต่อหน่วย ($) <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" id="p_price" class="form-control" placeholder="0.00">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">จำนวนคงเหลือในสต็อก</label>
                            <input type="number" id="p_stock" class="form-control" placeholder="0">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>
                    <button type="button" class="btn btn-primary fw-bold" onclick="saveProduct()">บันทึกข้อมูล</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const productModal = new bootstrap.Modal(document.getElementById('productModal'));

        // ดึงข้อมูลสินค้า (READ)
        function loadProducts() {
            const search = document.getElementById('searchInput').value;
            fetch(`api.php?action=read&search=${encodeURIComponent(search)}`)
                .then(res => res.json())
                .then(data => {
                    let rows = '';
                    if (!data || data.length === 0) {
                        rows = `<tr><td colspan="5" class="text-center py-4 text-muted">ไม่พบข้อมูลสินค้า</td></tr>`;
                    } else {
                        data.forEach(p => {
                            rows += `
                                <tr>
                                    <td class="text-center font-monospace">${p.ProductID}</td>
                                    <td class="fw-bold">${escapeHtml(p.ProductName)}</td>
                                    <td class="text-end">$${parseFloat(p.UnitPrice || 0).toFixed(2)}</td>
                                    <td class="text-end">${p.UnitsInStock || 0}</td>
                                    <td class="text-center">
                                        <button class="btn btn-sm btn-outline-warning me-1" onclick="openEditModal(${p.ProductID}, '${escapeJs(p.ProductName)}', ${p.UnitPrice}, ${p.UnitsInStock})">แก้ไข</button>
                                        <button class="btn btn-sm btn-outline-danger" onclick="deleteProduct(${p.ProductID})">ลบ</button>
                                    </td>
                                </tr>`;
                        });
                    }
                    document.getElementById('productTable').innerHTML = rows;
                })
                .catch(err => console.error(err));
        }

        function escapeHtml(str) { return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
        function escapeJs(str) { return (str || '').replace(/'/g, "\\'").replace(/"/g, "&quot;"); }

        function openAddModal() {
            document.getElementById('p_id').value = '';
            document.getElementById('p_name').value = '';
            document.getElementById('p_price').value = '';
            document.getElementById('p_stock').value = '0';
            document.getElementById('modalTitle').innerText = 'เพิ่มสินค้าใหม่';
            productModal.show();
        }

        function openEditModal(id, name, price, stock) {
            document.getElementById('p_id').value = id;
            document.getElementById('p_name').value = name;
            document.getElementById('p_price').value = price;
            document.getElementById('p_stock').value = stock;
            document.getElementById('modalTitle').innerText = 'แก้ไขข้อมูลสินค้า';
            productModal.show();
        }

        // บันทึกข้อมูล (CREATE & UPDATE) + Validation + Alert
        function saveProduct() {
            const id = document.getElementById('p_id').value;
            const name = document.getElementById('p_name').value.trim();
            const price = document.getElementById('p_price').value;
            const stock = document.getElementById('p_stock').value;

            // Validation
            if (!name) {
                Swal.fire('แจ้งเตือน Validation', 'กรุณากรอกชื่อสินค้า', 'warning');
                return;
            }
            if (price === '' || parseFloat(price) < 0) {
                Swal.fire('แจ้งเตือน Validation', 'กรุณากรอกราคาที่ถูกต้อง (ห้ามติดลบ)', 'warning');
                return;
            }

            const action = id ? 'update' : 'create';
            const payload = { ProductID: id, ProductName: name, UnitPrice: price, UnitsInStock: stock };

            fetch(`api.php?action=${action}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(res => {
                if (res.status === 'success') {
                    Swal.fire('ทำรายการสำเร็จ!', res.message, 'success');
                    productModal.hide();
                    loadProducts();
                } else {
                    Swal.fire('เกิดข้อผิดพลาด!', res.message, 'error');
                }
            });
        }

        // ลบข้อมูล (DELETE)
        function deleteProduct(id) {
            Swal.fire({
                title: 'ยืนยันการลบสินค้า?',
                text: "หากลบแล้วข้อมูลจะหายไปจากระบบ",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'ยืนยันลบ',
                cancelButtonText: 'ยกเลิก'
            }).then((result) => {
                if (result.isConfirmed) {
                    fetch(`api.php?action=delete&id=${id}`)
                        .then(res => res.json())
                        .then(res => {
                            if (res.status === 'success') {
                                Swal.fire('ลบสำเร็จ!', res.message, 'success');
                                loadProducts();
                            } else {
                                Swal.fire('ไม่สามารถลบได้!', res.message, 'error');
                            }
                        });
                }
            });
        }

        loadProducts();
    </script>
</body>
</html>
